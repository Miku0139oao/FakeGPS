plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is configured outside the repository.
// Create keystore.properties in the project root (it is git-ignored):
//   storeFile=/absolute/path/to/fakegps-release.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.tencent.fakegps"
    compileSdk 36

    defaultConfig {
        applicationId "com.github.fakegps"
        minSdk 21
        targetSdk 36
        versionCode 5
        versionName "2.2.0"
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "FakeGPS_v${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation files('libs/lite-orm-1.9.2.jar')
    testImplementation 'junit:junit:4.13.2'
    implementation project(':loggerlibrary')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}

// The checked-in lite-orm jar is not covered by Gradle dependency verification.
def liteOrmJar = file('libs/lite-orm-1.9.2.jar')
tasks.register('verifyLiteOrmChecksum') {
    inputs.file(liteOrmJar)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        liteOrmJar.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().collect { String.format('%02x', it) }.join()
        def expected = '8b1ae01600c27ff75073825e6ecd1fcb354cb05d991932ab7da440eee26b9e6d'
        if (actual != expected) {
            throw new GradleException("lite-orm checksum mismatch: expected $expected, got $actual")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyLiteOrmChecksum' }
