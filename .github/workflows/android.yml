name: Android CI

on:
  push:
    branches: [ master, 'fix/**', 'feature/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint, unit tests, debug and release builds
        run: ./gradlew lintDebug lintRelease testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FakeGPS-debug
          path: app/build/outputs/apk/debug/*.apk
